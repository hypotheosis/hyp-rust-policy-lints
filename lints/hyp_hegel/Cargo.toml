[package]
name = "hyp_hegel"
version.workspace = true
description = "hypotheosis policy lints: require hegel property tests"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clippy_utils = { workspace = true }
dylint_linting = { workspace = true }

[dev-dependencies]
dylint_testing = { workspace = true }
hegeltest = { path = "hegel_stub" }
# Not used by hyp_hegel's code. `dylint_testing` pulls in `tracing` (via
# compiletest_rs -> rustfix) with only `std`; without this, a `-p hyp_hegel`
# build compiles a second, `#[instrument]`-less `libtracing-*.rlib`, and
# hyp_tracing/tests/ui.rs -- which picks the newest one -- can link its
# fixtures against it. Depending on it here unifies the features so the target
# dir only ever holds one `tracing` rlib.
tracing = { workspace = true }

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
